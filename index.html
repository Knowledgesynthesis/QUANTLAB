<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="QuantLab: interactive, evidence-based training in the clinical research data pipeline — audit, cleaning, missing data, regression diagnostics, collinearity, validation and reproducibility." />
    <meta name="theme-color" content="#1a1a19" />
    <title>QuantLab — Research Data Methods for Clinician-Scientists</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        var theme = 'system';
        try {
          var raw = localStorage.getItem('quantlab-v2');
          if (raw) theme = (JSON.parse(raw).state || {}).theme || 'system';
        } catch (e) {}
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
